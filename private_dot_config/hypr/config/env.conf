# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- NVIDIA Environment Variables ---
# Força o uso da NVIDIA como backend GBM
# env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# --- Outras variáveis ---
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
# WLR_RENDERER_ALLOW_SOFTWARE geralmente não é necessário a menos que sua GPU falhe, 
# mas se precisar:
# env = WLR_RENDERER_ALLOW_SOFTWARE,1

#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons   
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme

# 1. Resolver o aviso do XDG_CURRENT_DESKTOP
# O Hyprland reclama que está "hyprland" (minúsculo) vindo do UWSM, mas ele quer "Hyprland".
# Forçar a variável resolve o aviso e mantém a compatibilidade com apps.
env = XDG_CURRENT_DESKTOP,Hyprland
