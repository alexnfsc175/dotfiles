# https://itsohen.github.io/hyprrulefix Convert hyprland v1/v2 window and layer rules to v3.
# Base Rules
$center-float-large = match:class ^(center-float-large)$
windowrule = float on, size (monitor_w*0.7) (monitor_h*0.7), center 1, $center-float-large

$center-float = match:class ^(center-float)$
$center-float-title = match:title ^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$
windowrule = float on, size (monitor_w*0.5) (monitor_h*0.5), center 1, $center-float
windowrule = float on, size (monitor_w*0.5) (monitor_h*0.5), center 1, $center-float-title

$center-float-mini = match:class ^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrule = float on, size (monitor_w*0.3) (monitor_h*0.4), center 1, $center-float-mini


# Float Rules
# windowrule = float on, xfce-polkit|wleave|title:branchdialog|nwg-look|nm-connection-editor|org.twosheds.iwgtk|overskride|title:Picture-in-Picture
windowrule = float on, match:title xfce-polkit|wleave|title branchdialog|nwg-look|nm-connection-editor|org.twosheds.iwgtk|overskride|title:Picture-in-Picture

windowrule = tile on, match:class ^(qemu-system-x86_64)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0


# common modals
windowrule = float on, match:title ^(Open)$
windowrule = float on, match:title ^(Choose Files)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Confirm to replace files)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^([Xx]dg-desktop-portal-gtk)$
windowrule = float on, size (monitor_w*0.6) (monitor_h*0.7), match:class ^(mpv)$



# Workspace Rules
## System
windowrule = workspace 8, match:class ^(.*virt-manager.*)$|(.*PikaBackup.*)$|(.*VirtualBox Manager.*)$
windowrule = workspace 17, match:class ^(.*GParted.*)$|(.*clamtk.*)$|(.*gnome.Logs.*)$

## Gaming
windowrule = workspace 7, match:class ^(.*steam_app.*)$|(.*gamescope.*)$|(.*atlauncher.*)$|(.*Minecraft.*)$
windowrule = workspace 16 silent, match:class ^([Ss]team)$|(.*heroic.*)$
windowrule = workspace 7, match:class ^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$

## Media
windowrule = workspace 6, match:class ^(.*kdenlive.*)$
windowrule = workspace 21 silent, match:class ^(.*thunderbird.*)$
windowrule = workspace 22 silent, match:class ^(.*btop.*)$
windowrule = workspace 22 silent, match:class ^(.*nvtop.*)$
windowrule = workspace 10 silent, match:class ^(.*[Ss]potify.*)$|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)$
windowrule = workspace 20 silent, match:class ^(.*discord.*)$|(.*vesktop.*)$|(.*WebCord.*)$
windowrule = workspace 6, match:class ^(.*obsproject.*)$
windowrule = workspace 14, match:class ^(.*easyeffects.*)$|^(.*qpwgraph.*)$|(.*Helvum.*)$
windowrule = workspace 5, match:class ^(.*vital.*)$|(.*fl64.*)$|(.*nicotine_plus.*)$
windowrule = workspace 5, match:title ^(.*FL Studio.*)$
windowrule = workspace 4, match:class ^(.*pinta.*)$|(.*krita.*)$|(.*blender.*)$|(.*Upscayl.*)$

## Productivity/Dev
windowrule = workspace 9 silent, match:class ^(.*obsidian.*)$|(.*Zotero.*)$
windowrule = workspace 2, match:class ^(.*Code.*)$|(.*codium.*)$|(.*VSCodium.*)$|(.*neovide.*)$


# Animation Rules
windowrule = animation slide, match:title ^(.*cava.*)$
windowrule = animation popin, match:class ^(.*wleave.*)$


# Scratchpads
$scratchpad-large = match:class ^(scratchpad-large)$
windowrule = float on, center 1, size (monitor_w*0.7) (monitor_h*0.7), animation slide, workspace special: scratchpad-large silent, $scratchpad-large
windowrule = float on, match:title ^(Picture-in-Picture)$
$scratchpad = match:class ^(scratchpad)$
windowrule = float on, center 1, size (monitor_w*0.5) (monitor_h*0.5), animation slide, workspace special: scratchpad silent, $scratchpad

$scratchpad-mini = match:class ^(scratchpad-mini)$
windowrule = float on, center 1, size (monitor_w*0.3) (monitor_h*0.4), animation slide, workspace special: scratchpad-mini silent, $scratchpad-mini

$sideScratchpad = match:class ^(.*pavucontrol.*)$|(.*blueman-manager.*)$
windowrule = workspace special:scratchpad silent, $sideScratchpad
windowrule = size 30% 90%, $sideScratchpad
windowrule = float on, $sideScratchpad
windowrule = center 1, $sideScratchpad


# Specific App Rules
$videobridge = match:class ^(.*xwaylandvideobridge.*)$
windowrule = opacity 0.0 override 0.0 override, no_anim on, no_blur on, no_initial_focus on, max_size 1 1, $videobridge

$zathura = match:class ^(.*zathura.*)$
windowrule = float on, size (monitor_w*0.35) (monitor_h*0.9), center 1, $zathura

$scrcpy = match:class ^(.*scrcpy.*)$
windowrule = center 1, float on, $scrcpy

windowrule = no_initial_focus on, match:class (.*[Ss]potify.*)|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)

windowrule = idle_inhibit always, immediate on, match:class ^(.*steam_app.*)$
windowrule = idle_inhibit fullscreen, match:class ^(.*celluloid.*)$|^(.*mpv.*)$
windowrule = idle_inhibit fullscreen, match:class ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen.*)$


windowrule = float on, match:class ^(org.gnome.FileRoller)$
windowrule = float on, match:class ^(nemo)$, match:title ^(.*Properties.*)$

# Layer Rules
layerrule = animation popin, blur on, ignore_alpha 0, match:namespace rofi

layerrule = blur on, ignore_alpha 0, match:namespace waybar

layerrule = ignore_alpha 0, animation slide, match:namespace swaync-notification-window
layerrule = animation slide, match:namespace swaync-control-center

layerrule = animation fade, match:namespace swayosd

layerrule = animation fade, match:namespace selection
layerrule = animation fade, match:namespace hyprlock

layerrule = no_anim on, match:namespace hyprpicker
